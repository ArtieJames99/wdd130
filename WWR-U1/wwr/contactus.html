<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Jex-Rapids</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    main { max-width: 760px; padding: 50px 24px; }
    form { display: grid; gap: 18px; text-align: left; background: #fff; padding: 30px; border-radius: 8px; }
    label { color: #1E364C; font-weight: bold; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 6px; font: inherit; }
    textarea { min-height: 140px; }
    button { border: 0; cursor: pointer; background: #D9662B; color: #edf0f4; padding: 15px 30px; border-radius: 5px; font: inherit; }
  </style>
</head>
<body>
  <header>
    <a id="logo_link" href="index.html"><img class="logo" src="../images/JexRapids-Logo.png" alt="Jex-Rapids logo"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="site-plan-ranfting.html">Site Plan</a>
      <a href="contactus.html">Contact Us</a>
    </nav>
  </header>
  <main>
    <h1>Plan Your Adventure</h1>
    <p>Tell us what kind of rafting experience you are looking for.</p>
    <form action="#" method="post">
      <label for="name">Name<input id="name" name="name" required></label>
      <label for="email">Email<input id="email" name="email" type="email" required></label>
      <label for="message">Message<textarea id="message" name="message" required></textarea></label>
      <button type="submit">Send Request</button>
    </form>
  </main>
</body>
</html>
