<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Jex-Rapids</title>
  <link rel="icon" href="/images/JexRapids-Logo-fav-social.png" type="image/x-icon">
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <div id="content">
        <header>
            <a id="logo_link" href="index.html">
                <img class="logo" src="/images/JexRapids-Logo.png" alt="Jex-Rapids Logo image">
            </a>
            <nav>
                <a href="/index.html">Home</a>
                <a href="#">Page 2</a>
                <a href="site-plan-rafting.html">Site Plan</a>
                <a href="contactus.html">Contact Us</a>
            </nav>  
        </header>
        <div id="hero">
            <div id="hero-box">
                <img id="hero-img" src="/images/hero-image.png" alt="people onjoying white water rafting">
            </div>
            <section id="hero-msg">
                <h1 class="home-title">Chase the Adventure</h1>
                <h2>Make memories with Jex-Rapids</h2>
                <div class="button-box">
                    <a class="book" href="contactus.html">Book Now</a>
                    <hr>
                </div>
            </section>
        </div>
        <main class="home-grid">
            <section class="rivers-card">
                <img class="card-img" src="/images/rivers.jpg" alt="river in forest">
                <img class="icon" src="/images/river_icon.png" alt="river icon">
                <h2>Rivers</h2>
            </section>
            <section class="camping-card">
                <img class="card-img" src="/images/camping.jpg" alt="Tent in mountains">
                <img class="icon" src="/images/fire_icon.png" alt="fire icon">
                <h2>Camping</h2>
            </section>
            <div id="background"></div>
            <section class="rapids-card">
                <img class="card-img" src="/images/rapids.jpg" alt="white water rafting">
                <img class="icon" src="/images/oars.png" alt="oars icon">
                <h2>Rapids</h2>
            </section>
            <img class="mountains" src="/images/mountains.jpg" alt="Snow-covered mountains beside a river">
            <section class="msg">
                <h2>There is Something for Everyone</h2>
                <p>Enjoy the thrill and tranquility that our adventures offer!</p>
                <a class="join" href="contactus.html">Join Us</a>
            </section>
        </main>
        <footer>
            <p>JexRapids &copy; 2026 AJ Jex</p>
            <p><a href="site-plan-rafting.html">Site Plan</a></p>
            <p><a href="contactus.html">Contact Us</a></p>
            <div class="social">
                <a href="https://www.facebook.com/" target="_blank"><img src="/images/facebook.png" alt="facebook icon"></a>
                <a href="https://twitter.com/" target="_blank"><img src="/images/twitter.png" alt="twitter icon"></a>
                <a href="https://www.instagram.com/" target="_blank"><img src="/images/instagram.png" alt="instagram icon"></a>
            </div>
        </footer>
    </div>
</body>
</html>
