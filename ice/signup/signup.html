<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            position: relative;
            width: min(400px, calc(100% - 20px));
            margin: 25px auto;
            border: 10px solid navy;
            border-radius: 30px;
            overflow: hidden;
        }

        #formContainer h1 {
            display: block;
            box-sizing: border-box;
            padding: 95px 10px 10px;
            color: white;
            background-image: url('images/jesus_feeds_5000.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center 25;
            height: 190px;
            text-shadow: 2px 2px 1px rgba(0, 0, 0, 0.7);
            font-size: 2em;
            text-align: center;
            line-height: 1.1;
        }

        #formContainer h1::after {
            content: "Scripture a Day";
            display: block;
            font-size: 0.8em;
        }

        #formContainer h3 {
            text-align: center;
            background-color: #f9f9f9;
            padding: 20px 0;
        }

        #myForm {
            padding: 20px;
            background-color: #f9f9f9;
        }

        #closeBtn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 1.1em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        #closeBtn:hover {
            cursor: pointer;
            text-shadow: none;
        }

        #myForm label {
            display: inline-block;
            margin-bottom: 15px;
        }

        #myForm > label {
            width: 45%;
            vertical-align: middle;
        }

        #myForm > input[type="text"],
        #myForm > input[type="password"],
        #myForm > input[type="email"] {
            box-sizing: border-box;
            width: 50%;
            height: 22px;
            margin-bottom: 15px;
            vertical-align: middle;
        }

        #myForm div {
            display: inline-block;
            width: 50%;
            margin-bottom: 15px;
            vertical-align: middle;
        }

        #myForm section {
            text-align: center;
            margin: 10px 0 20px;
        }

        #myForm section label {
            margin: 0;
            width: auto;
        }

        #myForm section:last-child {
            margin-bottom: 0;
        }

        section button {
            padding: 2px 8px;
            background-color: lightgrey;
            border: 1px solid grey;
        }

        button:hover {
            cursor: pointer;
            background-color: navy;
            color: white;
        }

        footer {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            height: 100px;
            margin: 0 auto;
            background: #171717;
        }

        footer img {
            display: block;
            width: 95%;
            height: 100%;
            object-fit: contain;
            object-position: top ;
            border-right: 3px solid white;
        }

        footer img:last-child {
            border-right: 0;
        }



    </style>




</head>

<body>
    <div id="formContainer">
        <h1>Daily Feed</h1>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <footer>
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </footer>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
